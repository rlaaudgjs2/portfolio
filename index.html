<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>개발자 포트폴리오</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Hero -->
  <header class="hero">
    <div class="container">
      <p class="hero-greeting reveal" id="hero-greeting"></p>
      <h1 class="hero-title reveal" id="hero-title"></h1>
      <p class="hero-description reveal" id="hero-description"></p>
    </div>
  </header>

  <!-- About: 사진, 소개, 학력, 자격증 -->
  <section class="about" id="about">
    <div class="container about-inner">
      <div class="about-photo reveal">
        <img id="profile-photo" src="assets/profile-placeholder.svg" alt="프로필 사진" />
      </div>
      <div class="about-info">
        <h2 class="section-label reveal">About</h2>
        <p class="about-bio reveal" id="profile-bio"></p>
        <div class="contact-list reveal" id="profile-contact"></div>

        <div class="about-columns">
          <div class="about-col reveal">
            <h3>학력</h3>
            <ul id="education-list" class="info-list"></ul>
          </div>
          <div class="about-col reveal">
            <h3>자격증</h3>
            <ul id="certification-list" class="info-list"></ul>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Projects: 연도별 프로젝트 -->
  <section class="projects" id="projects">
    <div class="container">
      <h2 class="section-label reveal">Projects</h2>
      <div id="project-list" class="project-list"></div>
    </div>
  </section>

  <!-- Contact -->
  <footer class="contact" id="contact">
    <div class="container">
      <h2 class="section-label reveal">Contact</h2>
      <div class="contact-list contact-list-lg reveal" id="footer-contact"></div>
      <p class="footer-copy">&copy; <span id="footer-year"></span></p>
    </div>
  </footer>

  <!-- 프로젝트 상세 모달 -->
  <div id="project-modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" data-close-modal aria-label="닫기">&times;</button>
      <img id="modal-photo" class="modal-photo" src="" alt="" />
      <div class="modal-body">
        <span id="modal-year" class="modal-year"></span>
        <h3 id="modal-title"></h3>
        <div class="modal-field">
          <h4>주요 내용</h4>
          <p id="modal-content"></p>
        </div>
        <div class="modal-field">
          <h4>규모</h4>
          <p id="modal-scale"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
